name: Build Dub APK

permissions:
  contents: write

on:
  push:
    branches: [main, arena/142e15bf-manganhanh]
    paths:
      - 'dubapp/**'
      - '.github/workflows/build-dub-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dubapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Tải sherpa-onnx AAR (v1.12.20)
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/sherpa-onnx-1.12.20.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.20/sherpa-onnx-1.12.20.aar

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          # Đưa các dòng lỗi ra annotation để đọc được ngay trên GitHub/API
          { grep -E '^e: |^w: .*Kotlin|What went wrong|Could not |Execution failed|^> (Could|Failed|Cannot|Build)|Caused by|error:' build.log | head -40; tail -n 40 build.log; } | while IFS= read -r line; do
            printf '::error title=build::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g')"
          done
          echo "----- tail -----"
          tail -n 120 build.log
          exit $code

      - name: Liệt kê thư viện native trong APK (kiểm tra ABI)
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep '\.so$' | awk '{print $4}' | sort | while read f; do
            printf '::notice title=native-lib::%s\n' "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: TrungVietDub-debug-apk
          path: dubapp/app/build/outputs/apk/debug/app-debug.apk

      - name: Kiểm tra APK (zip hợp lệ, chữ ký hợp lệ)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -tq "$APK"
          ls -l "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Đưa APK lên GitHub Release (tải trực tiếp, không qua trang giải nén)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TrungVietDub-latest.apk
          gh release upload dub-latest TrungVietDub-latest.apk --clobber \
            || gh release create dub-latest TrungVietDub-latest.apk --prerelease \
                 --title "Bản dựng mới nhất (CI)" --notes "Tự động từ run ${GITHUB_RUN_NUMBER}"
