name: Publish installable Android APK
on:
  push:
    branches: [arena/070720fa-manganhanh]
    paths: [.github/workflows/publish-apk.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified APK from successful build
        uses: actions/download-artifact@v4
        with:
          name: PipeTube-APK
          path: apk
          run-id: 38742183106
          github-token: ${{ github.token }}
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv apk/app-release.apk apk/PipeTube.apk
          gh release create pipetube-android-v1.0.0-48d9255 apk/PipeTube.apk \
            --target 48d9255 \
            --title "PipeTube Android 1.0.0 — bản cài thử" \
            --notes "Tải PipeTube.apk bên dưới và mở trên điện thoại Android để cài trực tiếp. Không cần giải nén. Bản thử nghiệm dùng debug signing; không dành để phát hành Google Play. APK lấy từ build thành công #38742183106." \
            --prerelease
