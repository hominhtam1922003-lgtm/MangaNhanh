# Đăng APK "Mật Mã Yêu" đã build sẵn lên Release (tải trực tiếp, không qua ZIP).
# Không còn gắn cứng số phiên bản: truyền `version` khi chạy (mặc định 1.18.1) —
# tên tệp APK và tag Release đều suy ra từ đó. Artifact của workflow build có tên
# cố định MatMaYeu-APK nên không phải sửa gì khi tăng bản.
# Ghi chú: runner chỉ tải artifact của run đã kiểm tra lên và mở công khai.
# Lưu ý: runner không tạo được Release (403) — luôn tạo Release nháp cục bộ trước rồi push file này để runner tải APK lên.
name: Đăng APK Mật Mã Yêu tải trực tiếp

on:
  push:
    branches: [arena/6f7cfa08-manganhanh]
    paths: [.github/workflows/publish-love-apk.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID lần chạy "APK Mật Mã Yêu" đã thành công
        required: true
        default: "38709668419"
        type: string
      version:
        description: Phiên bản ghi trên tên tệp/tag (ví dụ 1.18.10)
        required: false
        default: "1.18.10"
        type: string

permissions:
  actions: read
  contents: write
  checks: write

concurrency:
  group: publish-love-apk
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/6f7cfa08-manganhanh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ inputs.version || '1.18.10' }}
      BUILD_RUN_ID: ${{ inputs.run_id || '38709668419' }}
      ARTIFACT_NAME: MatMaYeu-APK
      APK_FILE: MatMaYeu-${{ inputs.version || '1.18.10' }}.apk
    steps:
      - name: Kiểm tra nguồn APK đã build thành công
        id: verify
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > /tmp/love-run.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/love-run.json') as stream:
              run = json.load(stream)
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build chưa thành công'
          assert run['head_branch'] == 'arena/6f7cfa08-manganhanh', 'Sai nhánh nguồn APK'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Sai repository'
          assert run['path'] == '.github/workflows/build-couple-apk.yml', 'Sai workflow build'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={run['head_sha']}\n")
              output.write(f"tag=mat-ma-yeu-v{os.environ['APP_VERSION']}-test-{run['head_sha'][:7]}\n")
          PY
      - name: Lấy APK đã kiểm chứng qua REST API (không build lại, không đổi chữ ký)
        run: |
          exec > >(tee /tmp/love-download.log) 2>&1
          echo "BUILD_RUN_ID=$BUILD_RUN_ID · ARTIFACT_NAME=$ARTIFACT_NAME · FILE=$APK_FILE"
          mkdir -p release-apk
          for attempt in 1 2 3 4 5; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | select(.expired == false) | .id" | head -1)
            echo "Lần $attempt: artifact=$artifact_id"
            if [ -n "$artifact_id" ]; then
              code=$(curl -sSL --retry 3 --retry-all-errors --retry-delay 5 -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                -o /tmp/verified-artifact.zip)
              echo "HTTP $code · $(stat -c%s /tmp/verified-artifact.zip 2>/dev/null || echo 0) byte"
              if [ "$code" = "200" ] && python3 -c "import zipfile; zipfile.ZipFile('/tmp/verified-artifact.zip').extractall('release-apk')"; then
                echo "Đã tải và giải nén artifact $artifact_id của run $BUILD_RUN_ID"
                ls -l release-apk
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Không tải được artifact đã kiểm chứng." >&2
          exit 1
      - name: Kiểm tra gói APK và băm SHA256
        run: |
          test -s "release-apk/$APK_FILE"
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.path.join('release-apk', os.environ['APK_FILE'])) as apk:
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names and 'classes.dex' in names, 'Không phải APK Android'
              assert apk.testzip() is None, 'APK bị hỏng'
          PY
          cd release-apk
          sha256sum "$APK_FILE" > "$APK_FILE.sha256"
          cat "$APK_FILE.sha256" | tee /tmp/love-hash.log
          stat -c 'Dung lượng: %s byte' "$APK_FILE" | tee -a /tmp/love-hash.log
      - name: Đăng APK vào Release để tải trực tiếp
        env:
          VERIFIED_SHA: ${{ steps.verify.outputs.sha }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          exec > >(tee /tmp/love-publish.log) 2>&1
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "release-apk/$APK_FILE" "release-apk/$APK_FILE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            # Bản nhẹ (chỉ arm64-v8a) cho máy/mạng yếu — tải nhanh hơn khoảng một phần tư.
            thin="release-apk/${APK_FILE%.apk}-arm64.apk"
            thin_sum="release-apk/${APK_FILE%.apk}-arm64.sha256"
            if [ -f "$thin" ]; then
              gh release upload "$RELEASE_TAG" "$thin" "$thin_sum" --clobber --repo "$GITHUB_REPOSITORY"
            fi
          else
            cat > /tmp/love-notes.md <<EOF
          APK thử nghiệm **Mật Mã Yêu $APP_VERSION** cho **Android 7.0+ (API 24)**, ký bằng khóa gỡ lỗi nên cài đè lên bản 1.17.0 được, không mất dữ liệu.

          Tải **MatMaYeu-$APP_VERSION.apk** trong Assets để cài trực tiếp, không cần tải ZIP. Mạng yếu thì tải **MatMaYeu-$APP_VERSION-arm64.apk** (bản nhẹ, chỉ arm64-v8a — dùng được cho máy thật đời mới và LDPlayer 64-bit).

          Bản 1.16.0 đổi tên app thành **Mật Mã Yêu** (gói vn.haitraitim.app giữ nguyên nên cài đè được). Thêm: thu hồi tin nhắn xoá cả hai bên, thả cảm xúc vào tin nhắn và ảnh, vuốt để trả lời, giữ nút mic để gửi tin thoại, chấm "đang nhập…", báo đã xem kèm ảnh đại diện nhỏ, lưu ảnh người thương gửi về máy, đổi ảnh đại diện là máy kia thấy ngay, sửa lỗi gửi và chụp ảnh trong chat (bỏ hộp chọn ảnh hệ thống hay chết với lỗi "unregistered ActivityResultLauncher", chuyển sang thư viện ảnh trong app), thanh nhập liệu dạng viên thuốc, trái tim đập theo giọng nói trong cuộc gọi, nút Cúp máy đỏ to và nút tắt mic ở nửa dưới màn hình, thông báo bấm vào thẳng đoạn chat kèm nút Trả lời, và công tắc Giữ kết nối khi tắt màn hình.

          Cuộc gọi vẫn ba lớp (PeerJS có TURN miễn phí → WebRTC qua kênh ghép nối → kênh ghép nối). Muốn dùng TURN riêng thì đặt EXPO_PUBLIC_TURN_URLS/USER/CREDENTIAL rồi dựng lại APK.
          EOF
            gh release create "$RELEASE_TAG" "release-apk/$APK_FILE" "release-apk/$APK_FILE.sha256" --target "$VERIFIED_SHA" --title "Mật Mã Yêu $APP_VERSION — APK thử nghiệm" --notes-file /tmp/love-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets --repo "$GITHUB_REPOSITORY" | tee /tmp/love-release.json
          echo "APK tải trực tiếp: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_FILE" >> "$GITHUB_STEP_SUMMARY"
      - name: Công bố chẩn đoán đăng APK
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const paths = ['/tmp/love-download.log', '/tmp/love-hash.log', '/tmp/love-publish.log'].filter((file) => fs.existsSync(file));
            await github.rest.checks.create({
              ...context.repo, head_sha: context.sha,
              name: 'Love APK publication diagnostics', status: 'completed', conclusion: 'neutral',
              output: { title: 'Nhật ký đăng APK Mật Mã Yêu', summary: 'APK không build lại.',
                text: paths.length ? paths.map((file) => fs.readFileSync(file, 'utf8')).join('\n').slice(-50000) : 'Chưa chạy bước tải hoặc đăng Release.' }
            });
