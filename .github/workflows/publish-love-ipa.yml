# Đăng IPA "Mật Mã Yêu" (chưa ký) đã build sẵn lên Release (tải trực tiếp).
# Không gắn cứng số phiên bản: truyền `version` khi chạy, tên tệp/tag suy ra từ đó.
# Lưu ý: runner không tạo được Release (403) — luôn tạo Release nháp cục bộ trước rồi push file này để runner tải IPA lên.
name: Đăng IPA Mật Mã Yêu (iOS) tải trực tiếp

on:
  push:
    branches: [arena/6f7cfa08-manganhanh]
    paths: [.github/workflows/publish-love-ipa.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID lần chạy "IPA Mật Mã Yêu (iOS, chưa ký)" đã thành công
        required: true
        default: "38673090772"
        type: string
      version:
        description: Phiên bản ghi trên tên tệp/tag (ví dụ 1.18.3)
        required: false
        default: "1.18.3"
        type: string

permissions:
  actions: read
  contents: write
  checks: write

concurrency:
  group: publish-love-ipa
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/6f7cfa08-manganhanh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ inputs.version || '1.18.3' }}
      BUILD_RUN_ID: ${{ inputs.run_id || '38673090772' }}
      ARTIFACT_NAME: MatMaYeu-iOS-unsigned-IPA
      IPA_FILE: MatMaYeu-${{ inputs.version || '1.18.3' }}-unsigned.ipa
    steps:
      - name: Kiểm tra nguồn IPA đã build thành công
        id: verify
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > /tmp/ipa-run.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/ipa-run.json') as stream:
              run = json.load(stream)
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build iOS chưa thành công'
          assert run['head_branch'] == 'arena/6f7cfa08-manganhanh', 'Sai nhánh nguồn IPA'
          assert run['path'] == '.github/workflows/build-couple-ipa.yml', 'Sai workflow build iOS'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={run['head_sha']}\n")
              output.write(f"tag=mat-ma-yeu-ios-v{os.environ['APP_VERSION']}-test-{run['head_sha'][:7]}\n")
          PY
      - name: Lấy IPA đã kiểm chứng qua REST API (không build lại)
        run: |
          exec > >(tee /tmp/ipa-download.log) 2>&1
          echo "BUILD_RUN_ID=$BUILD_RUN_ID · ARTIFACT_NAME=$ARTIFACT_NAME · FILE=$IPA_FILE"
          mkdir -p release-ipa
          for attempt in 1 2 3 4 5; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | select(.expired == false) | .id" | head -1)
            echo "Lần $attempt: artifact=$artifact_id"
            if [ -n "$artifact_id" ]; then
              code=$(curl -sSL --retry 3 --retry-all-errors --retry-delay 5 -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                -o /tmp/verified-ipa.zip)
              echo "HTTP $code · $(stat -c%s /tmp/verified-ipa.zip 2>/dev/null || echo 0) byte"
              if [ "$code" = "200" ] && python3 -c "import zipfile; zipfile.ZipFile('/tmp/verified-ipa.zip').extractall('release-ipa')"; then
                echo "Đã tải và giải nén artifact $artifact_id của run $BUILD_RUN_ID"
                ls -l release-ipa
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Không tải được artifact đã kiểm chứng." >&2
          exit 1
      - name: Kiểm tra gói IPA (có Payload/*.app) và băm SHA256
        run: |
          test -s "release-ipa/$IPA_FILE"
          python3 - <<'PY'
          import os, zipfile
          path = os.path.join('release-ipa', os.environ['IPA_FILE'])
          with zipfile.ZipFile(path) as ipa:
              names = ipa.namelist()
              apps = [name for name in names if name.startswith('Payload/') and name.endswith('.app/')]
              assert apps, 'IPA không có Payload/*.app'
              assert ipa.testzip() is None, 'IPA bị hỏng'
              assert any(name.startswith(apps[0] + 'Info.plist') for name in names), 'Thiếu Info.plist'
              print('App trong IPA:', apps[0], '· tổng', len(names), 'mục')
          PY
          cd release-ipa
          sha256sum "$IPA_FILE" > "$IPA_FILE.sha256"
          cat "$IPA_FILE.sha256" | tee /tmp/ipa-hash.log
          stat -c 'Dung lượng: %s byte' "$IPA_FILE" | tee -a /tmp/ipa-hash.log
      - name: Đăng IPA vào Release để tải trực tiếp
        env:
          VERIFIED_SHA: ${{ steps.verify.outputs.sha }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          exec > >(tee /tmp/ipa-publish.log) 2>&1
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "release-ipa/$IPA_FILE" "release-ipa/$IPA_FILE.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            cat > /tmp/ipa-notes.md <<EOF
          Bản iOS **Mật Mã Yêu $APP_VERSION** (file .ipa **chưa ký**), lấy nguyên vẹn từ lần build trên macOS của GitHub Actions.

          Tải file **MatMaYeu-$APP_VERSION-unsigned.ipa** trong Assets. Gói \`vn.haitraitim.app\`.

          Bản 1.16.0 đổi tên app thành Mật Mã Yêu và thêm: thu hồi tin nhắn cả hai bên, thả cảm xúc, vuốt để trả lời, giữ mic gửi tin thoại, chấm đang nhập…, báo đã xem, lưu ảnh người thương gửi, ảnh đại diện sang máy kia, sửa lỗi gửi và chụp ảnh trong chat, thanh nhập liệu dạng viên thuốc, trái tim đập theo giọng nói, nút Cúp máy đỏ to, thông báo bấm vào thẳng đoạn chat kèm nút Trả lời, công tắc Giữ kết nối khi tắt màn hình.

          Cuộc gọi ba lớp (PeerJS có TURN miễn phí → WebRTC qua kênh ghép nối → kênh ghép nối), giữ chế độ âm thanh chạy nền khi tắt màn hình.

          iPhone **không cài file trực tiếp như APK**: ký lại bằng Sideloadly/AltStore với Apple ID miễn phí (hết hạn sau 7 ngày) hoặc Apple Developer 99 USD/năm để dùng TestFlight.
          EOF
            gh release create "$RELEASE_TAG" "release-ipa/$IPA_FILE" "release-ipa/$IPA_FILE.sha256" --target "$VERIFIED_SHA" --title "Mật Mã Yêu $APP_VERSION — IPA iOS (chưa ký)" --notes-file /tmp/ipa-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets --repo "$GITHUB_REPOSITORY" | tee /tmp/ipa-release.json
          echo "IPA tải trực tiếp: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$IPA_FILE" >> "$GITHUB_STEP_SUMMARY"
      - name: Công bố chẩn đoán đăng IPA
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const paths = ['/tmp/ipa-download.log', '/tmp/ipa-hash.log', '/tmp/ipa-publish.log'].filter((file) => fs.existsSync(file));
            await github.rest.checks.create({
              ...context.repo, head_sha: context.sha,
              name: 'Love IPA publication diagnostics', status: 'completed', conclusion: 'neutral',
              output: { title: 'Nhật ký đăng IPA Mật Mã Yêu', summary: 'IPA không build lại.',
                text: paths.length ? paths.map((file) => fs.readFileSync(file, 'utf8')).join('\n').slice(-50000) : 'Chưa chạy bước tải hoặc đăng Release.' }
            });
