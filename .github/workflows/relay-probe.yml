# Dò thật các trạm trung chuyển công cộng của Hai Trái Tim, chạy trên runner có Internet thật.
name: Dò trạm kết nối Mật Mã Yêu

on:
  push:
    branches: [arena/6f7cfa08-manganhanh]
    paths:
      [
        .github/workflows/relay-probe.yml,
        couple-love/scripts/relay-probe.mjs,
        couple-love/src/services/relayProtocol.mjs,
      ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  checks: write

concurrency:
  group: relay-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/arena/6f7cfa08-manganhanh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: couple-love
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: couple-love/package-lock.json
      - name: Cài gói phụ thuộc
        run: npm ci --no-audit --no-fund
      - name: Dò từng trạm (WebSocket + MQTT + hai máy gửi nhận)
        run: node scripts/relay-probe.mjs 2>&1 | tee /tmp/relay-probe.log
      - name: Công bố kết quả dò trạm
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const file = '/tmp/relay-probe-report.md';
            const log = '/tmp/relay-probe.log';
            const text = fs.existsSync(file) ? fs.readFileSync(file, 'utf8')
              : fs.existsSync(log) ? fs.readFileSync(log, 'utf8').slice(-30000)
              : 'Chương trình dò trạm chưa chạy.';
            await github.rest.checks.create({
              ...context.repo, head_sha: context.sha,
              name: 'Relay probe diagnostics', status: 'completed', conclusion: 'neutral',
              output: { title: 'Kết quả dò trạm trung chuyển', summary: 'Đo thật từ runner GitHub.', text: text.slice(-60000) }
            });
