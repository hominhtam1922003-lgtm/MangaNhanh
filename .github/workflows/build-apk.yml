name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Export static web
        run: |
          # On the GitHub Ubuntu runner, CORS isn't enforced by the Capacitor WebView
          # on native HTTP, so we build the static export (no /api routes).
          npm run export
          echo "=== out/ size ==="
          du -sh out/

      - name: Add & sync Capacitor Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          npx cap add android || true
          npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaNhanh-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
