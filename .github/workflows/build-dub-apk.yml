name: Build Dub APK

on:
  push:
    branches: [main, arena/142e15bf-manganhanh]
    paths:
      - 'dubapp/**'
      - '.github/workflows/build-dub-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dubapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Tải sherpa-onnx AAR (v1.13.8)
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TrungVietDub-debug-apk
          path: dubapp/app/build/outputs/apk/debug/app-debug.apk
