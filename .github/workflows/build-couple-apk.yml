name: APK Mật Mã Yêu
on:
  workflow_dispatch:
  push:
    branches: [main, arena/6f7cfa08-manganhanh]
    paths:
      [
        "couple-love/**",
        ".github/workflows/build-couple-apk.yml",
        "App.tsx",
        "src/**",
        "scripts/**",
        "tests/**",
        "package*.json",
        "*.config.js",
        ".github/workflows/build-apk.yml",
      ]
  pull_request:
    paths:
      [
        "couple-love/**",
        ".github/workflows/build-couple-apk.yml",
        "App.tsx",
        "src/**",
        "scripts/**",
        "tests/**",
        "package*.json",
        "*.config.js",
        ".github/workflows/build-apk.yml",
      ]
permissions:
  contents: read
  checks: write
concurrency:
  group: love-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: "1"
      EXPO_OFFLINE: "1"
      EXPO_NO_TELEMETRY: "1"
      PROJECT_DIR: "."
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.LOVE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.LOVE_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.LOVE_EAS_PROJECT_ID }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5
      - name: Xác định thư mục dự án
        run: |
          if [ -f couple-love/package.json ]; then echo 'PROJECT_DIR=couple-love' >> "$GITHUB_ENV"; fi
      - name: Cài Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Cài Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Chuẩn bị Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK: $ANDROID_HOME"
      - name: Cài phụ thuộc từ lockfile
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --no-audit --no-fund
      - name: Đọc phiên bản để đặt tên tệp (không cần sửa workflow mỗi lần tăng bản)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APP_VERSION=$(node -p "require('./app.config.js').expo.version")
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Phiên bản dựng: $APP_VERSION"
      - name: Kiểm tra logic, RLS PostgreSQL và TypeScript
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          : > /tmp/check.log
          npm test >> /tmp/check.log 2>&1; code=$?
          if [ "$code" -eq 0 ]; then npm run check >> /tmp/check.log 2>&1; code=$?; fi
          if [ "$code" -eq 0 ]; then npm run format:check >> /tmp/check.log 2>&1; code=$?; fi
          tail -c 40000 /tmp/check.log
          if [ "$code" -ne 0 ]; then
            {
              echo '### Kiểm tra thất bại (log đầy đủ bên dưới)'
              echo '```'
              tail -c 20000 /tmp/check.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Cấu hình FCM nếu đã có secret
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.LOVE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          fi
      - name: Sinh dự án Android Expo
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx expo prebuild --platform android --no-install --clean
      - name: Ký APK nếu đã có keystore riêng
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.LOVE_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LOVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.LOVE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.LOVE_ANDROID_KEY_PASSWORD }}
        run: node scripts/sign-android.cjs
      - name: Build APK chứa JavaScript, không cần Metro khi chạy
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LOVE_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.LOVE_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.LOVE_ANDROID_KEY_PASSWORD }}
        run: |
          exec > >(tee ../android-build.log) 2>&1
          # Máy chủ Maven/Gradle Portal thỉnh thoảng trả lỗi tạm thời khiến Gradle không tìm thấy
          # thư viện Kotlin (lần build 1.13.0 đầu tiên bị đúng lỗi này), nên bật thử lại nhiều lần
          # cho mỗi yêu cầu tải thư viện. Không đổi mã ứng dụng, chỉ đổi cách lấy thư viện khi build.
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=500 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          cp app/build/outputs/apk/release/app-release.apk ../MatMaYeu-${APP_VERSION}.apk
          # Bản nhẹ: chỉ arm64-v8a (máy thật đời mới và LDPlayer 64-bit đều dùng được),
          # nhỏ hơn khoảng một phần tư nên dễ tải khi mạng yếu.
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=500 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          cp app/build/outputs/apk/release/app-release.apk ../MatMaYeu-${APP_VERSION}-arm64.apk
          cd ..
          sha256sum MatMaYeu-${APP_VERSION}.apk > MatMaYeu-${APP_VERSION}.sha256
          sha256sum MatMaYeu-${APP_VERSION}-arm64.apk > MatMaYeu-${APP_VERSION}-arm64.sha256
          ls -l MatMaYeu-${APP_VERSION}*.apk
      - name: Tải APK xuống từ Artifacts
        uses: actions/upload-artifact@v4
        with:
          # Tên artifact cố định (không kèm số phiên bản): workflow đăng Release chỉ
          # cần biết một tên duy nhất, muốn tăng bản thì chỉ sửa app.config.js.
          name: MatMaYeu-APK
          path: |
            ${{ env.PROJECT_DIR }}/MatMaYeu-*.apk
            ${{ env.PROJECT_DIR }}/MatMaYeu-*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Đính kèm lỗi build vào GitHub Checks
        if: failure() && github.event_name != 'pull_request'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-diagnostics.cjs
          if [ -f /tmp/love-build-check.json ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input /tmp/love-build-check.json
          fi
