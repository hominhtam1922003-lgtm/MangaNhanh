name: Build APK Lịch Nhắc

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cài Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Thông tin môi trường
        run: flutter --version
      - name: Cài dependencies
        run: flutter pub get
      - name: Định dạng mã nguồn
        run: dart format lib test
      - name: Phân tích mã nguồn
        run: flutter analyze
      - name: Kiểm thử
        run: flutter test
      - name: Build APK release để cài thử
        run: flutter build apk --release
      - name: Tải lên APK
        uses: actions/upload-artifact@v4
        with:
          name: lich-nhac-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
