# Dựng bản iOS (.ipa) cho Hai Trái Tim trên máy macOS của GitHub Actions.
# Bản này KHÔNG ký sẵn: để cài vào iPhone, bạn ký lại bằng Apple ID của mình
# (AltStore / Sideloadly trên Windows, hoặc Xcode trên Mac). Ký bằng Apple ID
# miễn phí thì app hết hạn sau 7 ngày và phải ký lại; tài khoản Apple Developer
# có phí (99 USD/năm) thì dùng TestFlight và không phải ký lại.
name: IPA Hai Trái Tim (iOS, chưa ký)
on:
  workflow_dispatch:
  push:
    branches: [main, arena/6f7cfa08-manganhanh]
    paths: ["couple-love/**", ".github/workflows/build-couple-ipa.yml"]
permissions:
  contents: read
  checks: write
concurrency:
  group: love-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      PROJECT_DIR: "."
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5
      - name: Xác định thư mục dự án
        run: |
          if [ -f couple-love/package.json ]; then echo 'PROJECT_DIR=couple-love' >> "$GITHUB_ENV"; fi
      - name: Cài Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Chọn Xcode mới nhất có sẵn
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: Cài phụ thuộc từ lockfile
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --no-audit --no-fund
      - name: Sinh dự án iOS (Expo prebuild)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Cài CocoaPods
        working-directory: ${{ env.PROJECT_DIR }}/ios
        run: |
          if [ -f Gemfile ]; then
            bundle install
            bundle exec pod install
          else
            pod install
          fi
      - name: Build iOS bản Release, không ký
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          PROJECT_NAME=$(basename "$(ls -d ios/*.xcodeproj | head -1)" .xcodeproj)
          echo "Workspace: $WORKSPACE · Project: $PROJECT_NAME"
          xcodebuild -list -workspace "$WORKSPACE" -json > ../ios-schemes.json 2>&1 || true
          cat ../ios-schemes.json | head -30 || true
          # Scheme của app chính là tên project Expo sinh ra; nếu không có thì lọc bỏ
          # các scheme của thư viện (Pods, Expo, React, hermes, Yoga...).
          export PROJECT_NAME
          SCHEME=$(python3 -c "
          import json, os, sys
          path = '../ios-schemes.json'
          name = os.environ.get('PROJECT_NAME', '')
          try:
            schemes = json.load(open(path))['workspace']['schemes']
          except Exception:
            schemes = []
          skip = ('Pod', 'Expo', 'EX', 'React', 'hermes', 'Yoga', 'FBLazyVector', 'RCT')
          if name in schemes:
            print(name)
          else:
            print(next((s for s in schemes if not s.startswith(skip)), schemes[0] if schemes else name))
          ") || SCHEME="$PROJECT_NAME"
          echo "Scheme dùng để build: $SCHEME"
          DERIVED="$PWD/ios/build"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../ios-build.log | tail -20
          echo "--- Hỏi Xcode xem sản phẩm nằm ở đâu ---"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -showBuildSettings > ../ios-settings.log 2>&1 || true
          grep -E "(TARGET_BUILD_DIR|FULL_PRODUCT_NAME|WRAPPER_NAME|BUILT_PRODUCTS_DIR) = " ../ios-settings.log || true
          find "$DERIVED" -maxdepth 5 -type d -name "*.app" -print || true
      - name: Đóng gói .ipa chưa ký
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          exec > >(tee ../ipa-package.log) 2>&1
          VERSION=$(node -p "require('./app.config.js').expo.version")
          echo "Phiên bản: $VERSION"
          echo "=== Cây xcarchive ==="
          ls -la ios/build/HaiTraiTim.xcarchive 2>/dev/null || true
          ls -la ios/build/HaiTraiTim.xcarchive/Products 2>/dev/null || true
          ls -la ios/build/HaiTraiTim.xcarchive/Products/Applications 2>/dev/null || true
          echo "=== Sản phẩm build ==="
          ls -la ios/build/Build/Products 2>/dev/null || true
          for dir in ios/build/Build/Products/*; do ls -la "$dir" 2>/dev/null | head -20; done
          echo "=== Vị trí Xcode báo ==="
          APP=""
          if [ -f ../ios-settings.log ]; then
            BUILT=$(grep -m1 "^ *TARGET_BUILD_DIR = " ../ios-settings.log | sed "s/^ *TARGET_BUILD_DIR = //")
            NAME=$(grep -m1 "^ *FULL_PRODUCT_NAME = " ../ios-settings.log | sed "s/^ *FULL_PRODUCT_NAME = //")
            echo "TARGET_BUILD_DIR=$BUILT · FULL_PRODUCT_NAME=$NAME"
            if [ -n "$BUILT" ] && [ -n "$NAME" ] && [ -d "$BUILT/$NAME" ]; then
              APP="$BUILT/$NAME"
            fi
          fi
          echo "=== Tìm .app trong toàn dự án ==="
          find . -maxdepth 8 -type d -name "*.app" 2>/dev/null | head -20 || true
          if [ -z "$APP" ]; then
            APP=$(find . -maxdepth 8 -type d -name "*.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 8 -type d -name "*.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "Không tìm thấy .app. 60 dòng cuối nhật ký build:"
            tail -60 ../ios-build.log 2>/dev/null || true
            exit 1
          fi
          echo "Ứng dụng: $APP"
          rm -rf ios/Payload
          mkdir -p ios/Payload
          cp -R "$APP" ios/Payload/
          cd ios
          zip -qry "../HaiTraiTim-$VERSION-unsigned.ipa" Payload
          cd ..
          ls -l "HaiTraiTim-$VERSION-unsigned.ipa"
          unzip -l "HaiTraiTim-$VERSION-unsigned.ipa" | head -12
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "HaiTraiTim-$VERSION-unsigned.ipa"
          else
            shasum -a 256 "HaiTraiTim-$VERSION-unsigned.ipa"
          fi | tee "HaiTraiTim-$VERSION-unsigned.ipa.sha256"
      - name: Tải .ipa lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HaiTraiTim-iOS-unsigned-IPA
          path: |
            ${{ env.PROJECT_DIR }}/HaiTraiTim-*-unsigned.ipa
            ${{ env.PROJECT_DIR }}/HaiTraiTim-*-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Đính kèm lỗi build iOS vào GitHub Checks
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const limit = 60000;
            const clean = (text) => {
              let safe = text.replace(/\x1b\[[0-9;]*m/g, '');
              for (const [key, value] of Object.entries(process.env))
                if (/TOKEN|PASSWORD|SECRET|KEYSTORE|SUPABASE/.test(key) && typeof value === 'string' && value.length > 5)
                  safe = safe.split(value).join('[ĐÃ CHE]');
              return safe;
            };
            const sections = [];
            for (const file of ['/tmp/check.log', 'ios-build.log', 'ios-settings.log', 'ipa-package.log']) {
              if (!fs.existsSync(file)) continue;
              const lines = fs.readFileSync(file, 'utf8').split('\n').slice(-150).join('\n');
              sections.push(`## ${file}\n\n\`\`\`text\n${clean(lines).slice(-limit)}\n\`\`\``);
            }
            if (!sections.length) return;
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Chẩn đoán build iOS Hai Trái Tim',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Nhật ký build iOS đã che bí mật',
                summary: 'IPA chưa dựng xong. Xem nhật ký để sửa cấu hình.',
                text: sections.join('\n\n').slice(0, 65000),
              },
            });
