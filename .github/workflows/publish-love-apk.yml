# Nguồn APK 1.8.0: run_id 38532880571 (commit cf8c282, artifact HaiTraiTim-1.8.0-APK).
# Lưu ý: runner không tạo được Release (403) — luôn tạo Release nháp cục bộ trước rồi push file này để runner tải APK lên.
name: Đăng APK Hai Trái Tim tải trực tiếp

on:
  push:
    branches: [arena/6f7cfa08-manganhanh]
    paths: [.github/workflows/publish-love-apk.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID lần chạy "APK Hai Trái Tim" đã thành công
        required: true
        default: '38532880571'
        type: string

permissions:
  actions: read
  contents: write
  checks: write

concurrency:
  group: publish-love-apk
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/6f7cfa08-manganhanh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.run_id || '38532880571' }}
    steps:
      - name: Kiểm tra nguồn APK đã build thành công
        id: verify
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > /tmp/love-run.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/love-run.json') as stream:
              run = json.load(stream)
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Build chưa thành công'
          assert run['head_branch'] == 'arena/6f7cfa08-manganhanh', 'Sai nhánh nguồn APK'
          assert run['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY'], 'Sai repository'
          assert run['path'] == '.github/workflows/build-couple-apk.yml', 'Sai workflow build'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"sha={run['head_sha']}\n")
              output.write(f"tag=hai-trai-tim-v1.8.0-test-{run['head_sha'][:7]}\n")
          PY
      - name: Lấy APK đã kiểm chứng qua REST API (không build lại, không đổi chữ ký)
        env:
          ARTIFACT_NAME: HaiTraiTim-1.8.0-APK
        run: |
          exec > >(tee /tmp/love-download.log) 2>&1
          echo "BUILD_RUN_ID=$BUILD_RUN_ID · ARTIFACT_NAME=$ARTIFACT_NAME"
          mkdir -p release-apk
          for attempt in 1 2 3 4 5; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | select(.expired == false) | .id" | head -1)
            echo "Lần $attempt: artifact=$artifact_id"
            if [ -n "$artifact_id" ]; then
              code=$(curl -sSL --retry 3 --retry-all-errors --retry-delay 5 -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
                -o /tmp/verified-artifact.zip)
              echo "HTTP $code · $(stat -c%s /tmp/verified-artifact.zip 2>/dev/null || echo 0) byte"
              if [ "$code" = "200" ] && python3 -c "import zipfile; zipfile.ZipFile('/tmp/verified-artifact.zip').extractall('release-apk')"; then
                echo "Đã tải và giải nén artifact $artifact_id của run $BUILD_RUN_ID"
                ls -l release-apk
                exit 0
              fi
            fi
            sleep 20
          done
          echo "Không tải được artifact đã kiểm chứng." >&2
          exit 1
      - name: Kiểm tra gói APK và băm SHA256
        run: |
          test -s release-apk/HaiTraiTim-1.8.0.apk
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('release-apk/HaiTraiTim-1.8.0.apk') as apk:
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names and 'classes.dex' in names, 'Không phải APK Android'
              assert apk.testzip() is None, 'APK bị hỏng'
          PY
          cd release-apk
          sha256sum HaiTraiTim-1.8.0.apk > HaiTraiTim-1.8.0.apk.sha256
          cat HaiTraiTim-1.8.0.apk.sha256 | tee /tmp/love-hash.log
          stat -c 'Dung lượng: %s byte' HaiTraiTim-1.8.0.apk | tee -a /tmp/love-hash.log
      - name: Đăng APK vào Release để tải trực tiếp
        env:
          VERIFIED_SHA: ${{ steps.verify.outputs.sha }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
        run: |
          exec > >(tee /tmp/love-publish.log) 2>&1
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-apk/HaiTraiTim-1.8.0.apk release-apk/HaiTraiTim-1.8.0.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            cat > /tmp/love-notes.md <<EOF
          APK thử nghiệm **Hai Trái Tim 1.8.0** cho **Android 7.0+ (API 24)**, lấy nguyên vẹn từ [lần build thành công](https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID).

          Tải file **HaiTraiTim-1.8.0.apk** trong Assets để cài trực tiếp, không cần tải ZIP.
          Commit nguồn: \`$VERIFIED_SHA\`.

          Bản 1.8.0 làm đúng những việc bạn nêu:

          1. **Đổi giao diện là mọi chữ tự đổi theo, kể cả khi lấy ảnh làm nền** — bảng màu có thêm màu chữ trên nền đậm nên không còn chữ trắng trên nền sáng hay chữ chìm; 12 bảng màu được hiệu chỉnh lại và **độ tương phản được kiểm tra tự động** trong bài kiểm thử. Nút gạt, dòng báo lỗi khi gõ ngày, tên chủ đề, nút chọn mã 6 số đều lấy màu từ chủ đề; lớp phủ ảnh nền ở chủ đề tối dày hơn để ảnh nền sáng cũng không làm chữ biến mất.
          2. **Sửa đúng lỗi “máy B viết nhật ký mà máy A không thấy”** — gói dữ liệu 60 KB khi quá lớn trước đây **cắt mất cả phần nhật ký**, nên cảm xúc và khoảnh khắc vẫn sang mà nhật ký thì không. Nay **nhật ký luôn nằm trong gói**; quá lớn thì cắt theo thứ tự khoảnh khắc → lời nhắc → tin nhắn → rút ngắn chữ trong nhật ký. Thẻ nhật ký gắn nhãn **của bạn** / **từ tên người thương**, và **nhật ký kết nối** ghi rõ `Đã gửi/Đã nhận: n kỷ niệm · cảm xúc` để thấy ngay dữ liệu đã đi hay chưa.
          3. **Nhớ nhau một cái 💌** — ở trang chủ có thẻ gửi một chạm (Nhớ người thương, Thương lắm, Ngủ ngon nhé); bấm là máy người thương **nổi thông báo như tin nhắn Messenger** và tin nằm trong mục Lời nhắc.
          4. **Nhắn tin giữa hai máy** — tab **Nhắn tin**: chữ, **emoji** (24 biểu tượng), **6 câu nhớ nhanh**, và **tin thoại ghi âm tối đa 30 giây** (nghe lại được, có trạng thái đang chờ gửi → đã gửi → mới nhận → đã xem, xoá được từng tin). Máy nào thiếu tệp tin thoại thì **tự xin gửi lại**.
          5. Giữ nguyên: Khoảnh khắc kiểu Locket, Lời yêu thương 09:00 và 21:00, ghép nối **mã 6 số**, dữ liệu **mã hoá đầu-cuối**, không cần máy chủ, không cần đăng ký.

          **Không cần máy chủ, không cần đăng ký:** hai bạn mở mục **Ghép nối**, một bạn bấm **Tạo mã 6 số**, bạn kia nhập đúng 6 số đó là hai máy chung dữ liệu.

          **Cần có:** cả hai máy đều có Internet (máy ảo LDPlayer cũng phải bật mạng), và dữ liệu mới chỉ tự sang nhau khi cả hai cùng mở app (một bên đóng app thì lần mở sau sẽ gửi bù). Tin thoại đi chậm hơn chữ một chút vì phải cắt thành nhiều mảnh.

          **Chưa kiểm chứng:** tin nhắn và tin thoại trên hai máy thật (mới kiểm thử bằng broker MQTT chạy trong máy), hai điện thoại thật, quét QR bằng camera thật, FCM/APNs, Face ID thật, FPS thực tế. Dự báo chu kỳ chỉ là phép tính lịch, không dùng để tránh thai. APK dùng chữ ký debug của mẫu Expo; hãy cấu hình keystore riêng để ký bản phát hành.
          EOF
            gh release create "$RELEASE_TAG" release-apk/HaiTraiTim-1.8.0.apk release-apk/HaiTraiTim-1.8.0.apk.sha256 --target "$VERIFIED_SHA" --title "Hai Trái Tim 1.8.0 — APK thử nghiệm" --notes-file /tmp/love-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets --repo "$GITHUB_REPOSITORY" | tee /tmp/love-release.json
          echo "APK tải trực tiếp: https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/HaiTraiTim-1.8.0.apk" >> "$GITHUB_STEP_SUMMARY"
      - name: Công bố chẩn đoán đăng APK
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const paths = ['/tmp/love-download.log', '/tmp/love-hash.log', '/tmp/love-publish.log'].filter((file) => fs.existsSync(file));
            await github.rest.checks.create({
              ...context.repo, head_sha: context.sha,
              name: 'Love APK publication diagnostics', status: 'completed', conclusion: 'neutral',
              output: { title: 'Nhật ký đăng APK Hai Trái Tim', summary: 'APK không build lại.',
                text: paths.length ? paths.map((file) => fs.readFileSync(file, 'utf8')).join('\n').slice(-50000) : 'Chưa chạy bước tải hoặc đăng Release.' }
            });
