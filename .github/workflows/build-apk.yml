name: Build APK Lịch Nhắc

on:
  push:
    branches: [main, arena/6f7cfa08-manganhanh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v5
      - name: Cài Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Cài Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Thông tin môi trường
        run: flutter --version 2>&1 | tee /tmp/lich-nhac-environment.log
      - name: Cài dependencies
        run: flutter pub get
      - name: Định dạng mã nguồn
        run: |
          dart format lib test
          git diff -- lib test > /tmp/lich-nhac-format.patch
      - name: Lưu mã đã định dạng và dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lich-nhac-source-checkpoint
          path: |
            pubspec.lock
            lib/
            test/
          retention-days: 7
      - name: Phân tích mã nguồn
        run: flutter analyze 2>&1 | tee /tmp/lich-nhac-analyze.log
      - name: Kiểm thử
        run: flutter test --reporter expanded 2>&1 | tee /tmp/lich-nhac-test.log
      - name: Thử kết nối nguồn thời tiết (không chặn build nếu nguồn tạm lỗi)
        continue-on-error: true
        run: python3 scripts/check-weather-api.py 2>&1 | tee /tmp/lich-nhac-weather-probe.log
      - name: Build APK release để cài thử
        run: flutter build apk --release 2>&1 | tee /tmp/lich-nhac-build.log
      - name: Tải lên APK
        uses: actions/upload-artifact@v4
        with:
          name: lich-nhac-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Công bố chẩn đoán qua GitHub Checks
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const files = [
              ['/tmp/lich-nhac-environment.log', 'Môi trường'],
              ['/tmp/lich-nhac-analyze.log', 'Analyze'],
              ['/tmp/lich-nhac-test.log', 'Test'],
              ['/tmp/lich-nhac-build.log', 'Build'],
              ['/tmp/lich-nhac-weather-probe.log', 'Nguồn thời tiết trực tiếp (điểm Mỹ Tho)'],
            ];
            const text = files.map(([file, title]) =>
              `## ${title}\n\n\`\`\`text\n${fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'Chưa chạy'}\n\`\`\``
            ).join('\n\n');
            const base = {
              ...context.repo,
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
            };
            await github.rest.checks.create({
              ...base,
              name: 'Flutter diagnostics',
              output: {
                title: 'Nhật ký xác minh Flutter',
                summary: 'Log analyze/test/build; kết quả chính thức ở job build-apk.',
                text: text.slice(-60000),
              },
            });
            for (const [file, name] of [
              ['pubspec.lock', 'Flutter dependency lock'],
              ['/tmp/lich-nhac-format.patch', 'Flutter formatting patch'],
            ]) {
              if (!fs.existsSync(file)) continue;
              await github.rest.checks.create({
                ...base,
                name,
                output: {
                  title: name,
                  summary: 'Dữ liệu xác minh dùng để cố định dependency và định dạng mã nguồn.',
                  text: fs.readFileSync(file, 'utf8').slice(0, 60000) || '(không có thay đổi)',
                },
              });
            }
